.CHECKBOX {
  width: min-content;
  display: flex; justify-content: center; align-items: center;
  gap: var(--spacing-normal);
}
.CHECKBOX > div {
  font: var(--font-base-sm);
}

.CHECKBOX > input {
  width: 20px;
  height: 20px;
  border: 2px solid;
  border-color: var(--color-gray-300);
  background-color: var(--color-gray-300);
  appearance: none;
  outline: none;
  cursor: pointer;
}
.CHECKBOX > input:not(:checked) {
  background-image: none !important;
}

.CHECKBOX > input:disabled {
  border-color: var(--color-gray-500);
  background-color: var(--color-gray-500);
  cursor: not-allowed;
}
.CHECKBOX > input:hover:not(:disabled) {
  border-color: var(--color-gray-500);
  background-color: var(--color-gray-500);
}

.CHECKBOX > input:not(:disabled):checked {
  border-color: var(--color-gray-900);
  background-color: var(--color-gray-900);
}
.CHECKBOX > input:not(:enabled):checked {
  border-color: var(--color-gray-500);
  background-color: var(--color-gray-500);
}

.HMI_SCREEN {
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 5fr;
  grid-template-rows: min-content 1fr;
}

.HMI_SCREEN > :nth-child(1) {
  grid-row: 1 / span 1;
  grid-column: 1 / span 2;

  padding: var(--spacing-massive);
  display: flex;
  align-items: center;
  justify-content: space-between;

  font: var(--font-display-3xl);
  font-weight: bold;
  
  background-color: var(--color-primary);
  border-bottom: 1px solid var(--color-gray-300);
}

.HMI_SCREEN > :nth-child(2) {
  grid-row: 2 / span 1;
  grid-column: 1 / span 1;
  background-color: var(--color-gray-200);
  border-right: 1px solid var(--color-gray-300);
  

  div {
    margin: 2rem var(--spacing-massive) 1rem var(--spacing-massive);
    font: var(--font-display-2xl);
    font-weight: lighter;
    border-bottom: 2px solid var(--color-gray-400);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;

    li > a {
      text-decoration: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      font: var(--font-display-2xl);
      color: var(--color-gray-950);
      padding: var(--spacing-large) var(--spacing-massive);

      svg {
        width: 24px;
        height: 24px;
        padding-right: var(--spacing-massive);
      }
    }

    li > a:hover {
      background-color: var(--color-gray-300);
    }

    li > .active  {
      font-weight: bold;
      border-right: 4px solid var(--color-primary);
      background-color: var(--color-gray-300);
    }
  }
}

.HMI_SCREEN > :nth-child(3) {
  grid-row: 2 / span 1;
  grid-column: 2 / span 1;

  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--color-gray-400) transparent;
}

.HMI_GRID {
  display: grid;
}

.HMI_CONTAINER {
  overflow: hidden;
}

.HMI_CONTAINER.hidden {
  display: none;
}

.HMI_USER_CONTAINER.not-in-user-list {
  filter: blur(1px);
  opacity: 0.4;
  pointer-events: none;
}
.DROPDOWN {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-normal);
}

.DROPDOWN > div {
  font: var(--font-base-xs);
  font-weight: bold;
}

.DROPDOWN > select {
  padding: var(--spacing-large);
  font: var(--font-base-sm);
  background-color: var(--color-gray-50);
  color: var(--color-gray-900);
  border: 1px solid var(--color-gray-300);
  border-radius: 0;
  border-left: 3px solid var(--color-gray-900);
  cursor: pointer;
  appearance: base-select;
}
.DROPDOWN > select:disabled {
  background-color: var(--color-gray-200);
  cursor: not-allowed;
}
.DROPDOWN > select:focus,
.DROPDOWN > select:active {
  outline: none;
  box-shadow: none;
}
.DROPDOWN > select:open {
  background-color: var(--color-gray-900);
  border-color: var(--color-gray-900);
  color: var(--color-gray-50);
}

.DROPDOWN > ::picker(select) {
  appearance: base-select;
  border: none;
}

.DROPDOWN > select > option {
  padding: var(--spacing-large);
  font: var(--font-base-sm);
  background-color: var(--color-gray-50);
  color: var(--color-gray-900);
  border: 1px solid var(--color-gray-300);
  border-top: none;
  appearance: base-select;

}
.DROPDOWN > select > option::checkmark {
  display: none;
}
.DROPDOWN > select > option:focus {
  border-left: 3px solid var(--color-primary);
}
.DROPDOWN > select > option:hover {
  background-color: var(--color-gray-200);
  border-left: 3px solid var(--color-gray-900);
}
.FORM {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-normal);
}

.FORM > div {
  font: var(--font-base-xs);
  font-weight: bold;
}

.FORM > input[type="number"]::-webkit-outer-spin-button,
.FORM > input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.FORM > input[type="number"] {
  appearance: textfield;
}

.FORM > input {
  cursor: pointer;
  
  border: 1px solid var(--color-gray-300);
  color: var(--color-gray-900);
  font: var(--font-base-sm);
  padding: var(--spacing-large);
}
.FORM > input:focus {
  color: var(--color-gray-900);
  outline: none;
}

.FORM > input:disabled {
  background-color: var(--color-gray-200);
  cursor: not-allowed;
}
.BAR {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-normal);
}

.BAR > div {
  font: var(--font-base-xs);
  font-weight: bold;
}

.BAR >div:last-child {
  border: 1px solid var(--color-gray-300);
}

.GAUGE {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-normal);
}

.GAUGE > div {
  font: var(--font-base-xs);
  font-weight: bold;
  text-align: center;
  width: 100%;
}

.GOM {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-normal);
}

.GOM > div:first-child {
  font: var(--font-base-xs);
  font-weight: bold;
}

.GOM > div:last-child {  
  border: 1px solid var(--color-gray-300);
  color: var(--color-gray-900);
  font: var(--font-base-sm);
  padding: var(--spacing-large);
  background-color: var(--color-gray-200);
  cursor: not-allowed;
}

.SIGN_IN {

  gap: var(--spacing-massive);
}

  width: 100%;
  height: 100%;
}

.SIGN_IN > input {
  cursor: pointer;
  
  border: 1px solid var(--color-gray-300);
  color: var(--color-gray-900);
  font: var(--font-base-sm);
  padding: var(--spacing-large);

}
.SIGN_IN > input:focus {
  color: var(--color-gray-900);
  outline: none;
}

.CHANGE_PASSWORD {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-large);
  width: 100%;
}

.CHANGE_PASSWORD > div {
  font: var(--font-base-sm);

.TEXT.text-sm { font: var(--font-base-sm); }
.TEXT.text-nm { font: var(--font-base-nm); }
.TEXT.text-lg { font: var(--font-base-lg); }
.TEXT_MONOSPACE.text-xs { font: var(--font-mono-xs); }
.TEXT_MONOSPACE.text-sm { font: var(--font-mono-sm); }
.TEXT_MONOSPACE.text-nm { font: var(--font-mono-nm); }

.H1, .H2, .H3, .H4, .H5, .H6, .TEXT, .TEXT_MONOSPACE {
  overflow: hidden;
  overflow-wrap: break-word;
}
.TOGGLE {
  width: min-content;
  display: flex; justify-content: center; align-items: center;
}
.TOGGLE > div {
  font: var(--font-base-sm);
  padding-right: var(--spacing-normal);
}

.TOGGLE > input {
  width: 38px;
  height: 24px;
  border-radius: 999px;
  border-color: var(--color-gray-300);
  background-color: var(--color-gray-300);
  appearance: none;
  outline: none;
  position: relative;
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.TOGGLE > input::before {
  content: '';
  position: absolute;
  top: 50%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  transform: translate(0, -50%);
  background-color: var(--color-gray-900);
  border: 2px solid var(--color-gray-300);
  transition: transform 140ms ease;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
}

.TOGGLE > input:disabled::before {
  background-color: var(--color-gray-500);
  cursor: not-allowed;
}
.TOGGLE > input:disabled {
  cursor: not-allowed;
}

.TOGGLE > input:not(:disabled):checked {
  border-color: var(--color-primary);
  background-color: var(--color-primary);
}
.TOGGLE > input:not(:enabled):checked {
  border-color: var(--color-gray-500);
  background-color: var(--color-gray-500);
}

.TOGGLE > input:checked::before {
  transform: translate(16px, -50%);
}
