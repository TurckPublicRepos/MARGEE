name: Deploy Astro output to public GitHub Pages repo

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Publish to pages repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd dist
          git init
          git remote add origin https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/TurckPublicRepos/turckpublicrepos.github.io.git
          git checkout -b documentatie-deploy
          git add .
          git commit -m "Deploy documentation site [skip ci]"
          git push -f origin documentatie-deploy:refs/heads/documentatie # <--- aparte branch/subdir
